version: '3.8'

# Override для локальной разработки
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev  # Отдельный Dockerfile для разработки
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
    volumes:
      - .:/code  # Монтируем код для live reload
      - static_volume:/code/static
      - media_volume:/code/media
    env_file:
      - .env.local  # Отдельный файл для локальной разработки

  celery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: celery -A config worker --loglevel=debug --concurrency=1
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
    volumes:
      - .:/code

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
    volumes:
      - .:/code

  db:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    ports:
      - "6379:6379"

volumes:
  postgres_data_dev:
    name: llm_postgres_data_dev