
services:
  db:
    image: postgres:16-alpine
    container_name: llm_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 30s
    restart: unless-stopped
    networks:
      - llm_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: llm_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
#    healthcheck:
#      test: ["CMD", "redis-cli", "ping"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 10s
    restart: unless-stopped
    networks:
      - llm_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    user: root
    image: skoro55/llm:latest
    container_name: llm_web
    command: >
      sh -c "
              python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput --clear &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8000
              --workers ${GUNICORN_WORKERS:-4}
              --threads ${GUNICORN_THREADS:-2}
              --timeout 120
              --keep-alive 5
              --access-logfile -
              --error-logfile -
            "
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - static_volume:/code/static
      - media_volume:/code/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 60s  # Django может дольше стартовать
    restart: unless-stopped
    networks:
      - llm_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"  # Больше логов для web

  nginx:
    image: nginx:alpine
    container_name: llm_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/code/static:ro
      - media_volume:/code/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
     - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]  # Проверяем конфигурацию
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      # Альтернативный тест с curl:
      # test: ["CMD", "curl", "-f", "http://localhost/health/"]
    restart: unless-stopped
    networks:
      - llm_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    user: root
    image: skoro55/llm:latest
    container_name: llm_celery
    command: >
      celery -A config worker 
      --loglevel=${CELERY_LOG_LEVEL:-info} 
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=1000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - media_volume:/code/media
    depends_on:
      - db
      - redis
#    healthcheck:
#      test: >
#        ["CMD-SHELL",
#        "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 30s
    restart: unless-stopped
    networks:
      - llm_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    user: root
    image: skoro55/llm:latest
    container_name: llm_celery_beat
    command: >
      celery -A config beat 
      --loglevel=${CELERY_LOG_LEVEL:-info} 
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - db
      - redis
      - celery
#    healthcheck:
#      test: >
#        ["CMD-SHELL",
#        "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
    restart: unless-stopped
    networks:
      - llm_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Опционально: Flower для мониторинга Celery
  flower:
    image: mher/flower:2.0
    container_name: llm_flower
    command: >
      celery --broker=redis://redis:6379/0 flower 
      --port=5555 
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
      --url_prefix=flower
    ports:
      - "5555:5555"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_healthy
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:5555"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 20s
    restart: unless-stopped
    networks:
      - llm_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring

volumes:
  postgres_data:
    name: llm_postgres_data
  redis_data:
    name: llm_redis_data
  static_volume:
    name: llm_static_data
  media_volume:
    name: llm_media_data

networks:
  llm_network:
    name: llm_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16