upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;
    
    # Максимальный размер загружаемых файлов (для LLM может понадобиться большой)
    client_max_body_size 100M;
    
    # Статические файлы (отдаются напрямую Nginx)
    location /static/ {
        alias /code/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Медиа файлы (загруженные пользователями)
    location /media/ {
        alias /code/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Health check endpoint (без логов)
    location /health/ {
        proxy_pass http://django/health/;
        access_log off;
        proxy_set_header Host $host;
    }
    
    # Основное Django приложение
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для долгих LLM запросов
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Буферизация для больших ответов
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/x-javascript image/svg+xml;
    gzip_comp_level 6;
}